<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | AIXConstruction</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <link

<body>

<div id="navbar"></div>

<section class="services-intro contact-hero">

    <div class="site-container services-intro-layout">

        <div class="services-intro-content contact-hero-content">

            <p class="contact-eyebrow">
                BOOK A FREE CONSULTATION
            </p>

            <h1>
                Let's explore how AI can create
                <span>real value</span>

            </h1>

            <p>
                Practical discussion &bull; Engineering expertise &bull; Clear next steps
            </p>

            <p class="contact-hero-closing">
                Let's build it together.
            </p>

        </div>

        <div class="services-intro-image contact-hero-image">

            <img
                src="images/hero-ai-contacts.png"
                alt="AI consultation for engineering and construction teams">

        </div>

    </div>

</section>

<section class="contact-page">

    <div class="site-container">

        <div
            class="calendly-inline-widget"

        </div>

    </div>

</section>

<div id="footer"></div>

    src="https://assets.calendly.com/assets/external/widget.js"
    async>
